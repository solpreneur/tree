services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: trees
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgresql_vol:/var/lib/postgresql
    healthcheck:
      # -h localhost checks the real server, not the temporary one used while the database is created.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d trees"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgresql_vol: